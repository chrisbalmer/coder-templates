# Lint every template on every PR and main push. A tag <template>-vX.Y.Z pushes
# templates/<template> to coderd as version vX.Y.Z; one tag, one template.
# Tags with -rc.N are pushed inactive (--activate=false) for testing, and
# leave the template's metadata alone unless they create the template.
# No --provisioner-tag: with none, Coder reuses the active version's tags.
#
# The release job needs a runner that can reach coderd, so it only runs where the
# repository variable CODER_URL is set: typically a mirror on a self-hosted
# Forgejo or Gitea, which run .github/workflows/ when there is no .forgejo/ or
# .gitea/. On GitHub, with CODER_URL unset, tags are linted and nothing is pushed.
#
# Settings on the forge that releases:
#   CODER_URL                  variable  https://coder.example.com
#   CODER_SESSION_TOKEN        secret    a template-admin token
#   CODER_TEMPLATE_VARIABLES   variable  optional YAML, keyed by template name, e.g.
#                                        k8s-stack: {storage_class_options: [fast, slow]}
#                              Coder doesn't keep template variable values between
#                              pushes, so every push passes them. List and map values
#                              are passed as JSON strings, which Terraform accepts.
name: release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*-v*"]

env:
  CHECKPOINT_DISABLE: "1"
  # Match the provisioner (coder-provisioner 2.37.3 ships Terraform 1.15.5).
  TF_VERSION: 1.15.5
  TF_SHA256: 702b2136af6728c8ff037f843dd2dbce2b7ad88786b7381d1d72aefa250f601c
  TFLINT_VERSION: v0.64.0
  TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
  # Icons are checked against this Coder version's bundled set when CODER_URL is unset.
  CODER_VERSION: v2.37.3
  YQ_VERSION: v4.53.6
  YQ_SHA256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install terraform, tflint and yq
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  tf.zip" | sha256sum -c -
          curl -fsSL -o tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          curl -fsSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          unzip -o -q tf.zip -d /usr/local/bin
          unzip -o -q tflint.zip -d /usr/local/bin
          install -m 0755 yq /usr/local/bin/yq
          terraform version && tflint --version && yq --version

      # Shared modules live in modules/ and are copied into each template, which
      # uses them as ./modules/<name>; see the script.
      - name: Vendor shared modules
        run: ./scripts/vendor-modules.sh

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init and validate
        run: |
          set -euo pipefail
          for d in templates/*/; do
            echo "::group::$d"
            (cd "$d" && terraform init -backend=false -input=false -lockfile=readonly && terraform validate)
            echo "::endgroup::"
          done

      - name: tflint
        # Bundled ruleset only, so --init downloads nothing. Shared modules are
        # validated through the templates that vendor them, and linted here on
        # their own (tflint needs no terraform init for them).
        run: |
          set -euo pipefail
          tflint --init --config "$PWD/.tflint.hcl"
          for d in modules/*/ templates/*/; do tflint --config "$PWD/.tflint.hcl" --chdir "$d"; done

      - name: template.yaml
        run: |
          set -euo pipefail
          fail=0
          for d in templates/*/; do
            dir=$(basename "$d"); f="$d/template.yaml"
            for k in name display_name icon description default_ttl activity_bump; do
              [ -n "$(yq -r ".$k // \"\"" "$f")" ] || { echo "::error::$f: $k is empty"; fail=1; }
            done
            # Autostop, passed to coder templates edit as Go durations. A zero
            # default_ttl would leave workspaces running until stopped by hand.
            for k in default_ttl activity_bump; do
              v=$(yq -r ".$k // \"\"" "$f")
              [ -n "$v" ] || continue # reported above
              [[ "$v" =~ ^([0-9]+(h|m|s))+$ ]] || { echo "::error::$f: $k \"$v\" isn't a duration like 8h or 1h30m"; fail=1; continue; }
              [ "$k" != default_ttl ] || [[ "$v" =~ [1-9] ]] || { echo "::error::$f: default_ttl must be more than zero"; fail=1; }
            done
            # The release tag names the directory, and the push uses .name,
            # so the two must agree.
            [ "$(yq -r .name "$f")" = "$dir" ] || { echo "::error::$f: name must be \"$dir\" (the directory name)"; fail=1; }
            # Coder's UI still routes /templates/<template>/<page> without an
            # organization, so a template named after a page can't be opened.
            case "$dir" in docs|files|resources|versions|embed|insights|prebuilds|workspace|settings)
              echo "::error::$f: \"$dir\" is a Coder template-page name; pick another"; fail=1 ;;
            esac
            len=$(yq -r .description "$f" | tr -d '\n' | wc -c)
            [ "$len" -lt 128 ] || { echo "::error::$f: description is $len bytes; Coder requires < 128"; fail=1; }
            [ -f "$d/README.md" ] || { echo "::error::$d: README.md missing (it's the template's Docs tab)"; fail=1; }
            [ -f "$d/REQUIREMENTS.md" ] || { echo "::error::$d: REQUIREMENTS.md missing (what the cluster needs for this template)"; fail=1; }
          done
          exit "$fail"

      - name: Icons exist in Coder
        # Coder's bundled set has no React, MinIO or MySQL icon; a missing
        # path renders as a blank square in the UI rather than failing. Checked
        # on coderd when CODER_URL is set, else in Coder's source at CODER_VERSION
        # (coderd serves site/static/ at /). yq -N: no "---" between files.
        env:
          # Not on pull requests: their paths would become requests to coderd.
          CODER_URL: ${{ github.event_name != 'pull_request' && vars.CODER_URL || '' }}
        run: |
          set -euo pipefail
          base="${CODER_URL:-https://raw.githubusercontent.com/coder/coder/${CODER_VERSION}/site/static}"
          fail=0
          for p in $(grep -rhoE '"/(icon|emojis)/[^"]+"' modules templates --include='*.tf' | tr -d '"' | sort -u) \
                   $(yq -N -r .icon templates/*/template.yaml | sort -u); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${p}")
            [ "$code" = 200 ] || { echo "::error::icon $p returns $code from $base"; fail=1; }
          done
          exit "$fail"

  release:
    needs: lint
    # Only where coderd is reachable; see the header.
    if: startsWith(github.ref, 'refs/tags/') && vars.CODER_URL != ''
    runs-on: ubuntu-latest
    env:
      CODER_URL: ${{ vars.CODER_URL }}
      CODER_SESSION_TOKEN: ${{ secrets.CODER_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          re='^([a-z0-9][a-z0-9-]*)-(v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$'
          [[ "$tag" =~ $re ]] || { echo "::error::tag $tag isn't <template>-vX.Y.Z[-rc.N]"; exit 1; }
          template="${BASH_REMATCH[1]}"; version="${BASH_REMATCH[2]}"
          [ -f "templates/$template/template.yaml" ] || { echo "::error::no templates/$template for tag $tag"; exit 1; }
          echo "Template $template, version $version"
          {
            echo "template=$template"
            echo "version=$version"
            echo "dir=templates/$template"
          } >> "$GITHUB_OUTPUT"

      # The template uses the shared modules as ./modules/<name>; the upload
      # must carry real copies.
      - name: Vendor shared modules
        run: ./scripts/vendor-modules.sh

      # From coderd itself, so the CLI always matches the server version.
      - name: Install coder CLI and yq
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/coder "${CODER_URL}/bin/coder-linux-amd64"
          chmod +x /usr/local/bin/coder
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          install -m 0755 /tmp/yq /usr/local/bin/yq
          coder version

      - name: Push template version
        id: push
        env:
          NAME: ${{ steps.tag.outputs.template }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIR: ${{ steps.tag.outputs.dir }}
          TEMPLATE_VARIABLES: ${{ vars.CODER_TEMPLATE_VARIABLES }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Version message, which Coder shows in its "Update workspace?" dialog: an
          # annotated tag's message, else the tagged commit's subject. actions/checkout
          # fetches the commit but not the tag object, so fetch the tag itself first.
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            message=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN /,$d')
          else
            message=$(git log -1 --format=%s)
          fi
          echo "Version message: ${message%%$'\n'*}"
          vars_args=()
          if [ -n "${TEMPLATE_VARIABLES}" ]; then
            # --variables-file takes string values only; lists and maps go as JSON.
            printf '%s\n' "$TEMPLATE_VARIABLES" | NAME="$NAME" \
              yq -o yaml '.[strenv(NAME)] // {} | (.[] | select(tag == "!!seq" or tag == "!!map")) |= to_json(0)' \
              > /tmp/template-vars.yaml
            if [ "$(yq 'length' /tmp/template-vars.yaml)" -gt 0 ]; then
              echo "Template variables: $(yq -o json -I0 'keys' /tmp/template-vars.yaml)"
              vars_args=(--variables-file /tmp/template-vars.yaml)
            fi
          fi
          activate=true
          case "$VERSION" in *-rc*) activate=false ;; esac
          # Metadata applies to the whole template, not a version, so an
          # inactive -rc push must not change it; except when this push
          # creates the template, which would otherwise have none.
          metadata=$activate
          # A failed lookup fails the job rather than passing as "doesn't exist".
          templates=$(curl -fsS -H "Coder-Session-Token: ${CODER_SESSION_TOKEN}" "${CODER_URL}/api/v2/templates")
          exists=$(printf '%s' "$templates" | NAME="$NAME" yq -p json 'any_c(.name == strenv(NAME))')
          [ "$exists" = true ] || metadata=true
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          echo "Pushing $NAME version $VERSION (activate=$activate)"
          coder templates push "$NAME" \
            --directory "$DIR" \
            --name "$VERSION" \
            --message "$message" \
            --activate="$activate" \
            "${vars_args[@]}" \
            --yes

      # coder templates edit re-sends the template's current value for every
      # flag not given here (autostop requirement, autostart, dormancy, failure
      # TTL, allow-user-*), so only these fields change.
      - name: Apply template metadata
        if: steps.push.outputs.metadata == 'true'
        env:
          DIR: ${{ steps.tag.outputs.dir }}
        run: |
          set -euo pipefail
          f="$DIR/template.yaml"
          coder templates edit "$(yq -r .name "$f")" \
            --display-name "$(yq -r .display_name "$f")" \
            --description "$(yq -r .description "$f")" \
            --icon "$(yq -r .icon "$f")" \
            --default-ttl "$(yq -r .default_ttl "$f")" \
            --activity-bump "$(yq -r .activity_bump "$f")" \
            --yes
